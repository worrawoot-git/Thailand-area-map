<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนที่ประเทศไทย 77 จังหวัด</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f2;--panel:#fff;--ink:#1d2b26;--mut:#5d6b65;--line:#d5dcd7;--acc:#0f6b57;--accink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a18;--panel:#1d2522;--ink:#e8efeb;--mut:#9aa8a1;--line:#33403b;--acc:#3fb899;--accink:#0c1512}}
:root[data-theme="dark"]{--bg:#141a18;--panel:#1d2522;--ink:#e8efeb;--mut:#9aa8a1;--line:#33403b;--acc:#3fb899;--accink:#0c1512}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Sarabun,'Noto Sans Thai',Tahoma,sans-serif}
header{padding:20px 20px 4px;max-width:1200px;margin:0 auto}
h1{margin:0;font-size:1.6rem;font-weight:700}
header p{margin:4px 0 0;color:var(--mut)}
main{max-width:1200px;margin:0 auto;padding:12px 20px 40px;display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{margin:0 0 10px;font-size:1.05rem}
#rows{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding-right:2px}
.row{display:flex;gap:6px;align-items:center}
.row select{flex:1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.row input[type=color]{width:38px;height:38px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer}
button{font:inherit;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.x{padding:6px 10px;color:var(--mut)}
button.primary{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions .primary{flex:1 1 100%;padding:10px}
#msg{margin:10px 0 0;font-size:.9rem;color:var(--mut);min-height:1.3em}
#stage{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:320px;display:flex;justify-content:center}
#stage svg{max-width:100%;height:auto;display:block}
.ttl{display:block;width:100%;margin:0 0 14px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.lbl{display:block;margin:0 0 4px;font-size:.9rem;color:var(--mut)}
.opt{display:flex;align-items:center;gap:8px;margin-top:12px;cursor:pointer;user-select:none}.opt input{width:18px;height:18px;accent-color:var(--acc)}
.empty{align-self:center;color:#6b7771;padding:40px;text-align:center}
</style>
</head>
<body>
<header>
<h1>แผนที่ประเทศไทย 77 จังหวัด</h1>
<p>เลือกจังหวัดหรือภาค ใส่สี แล้วกดประมวลผลเพื่อสร้างแผนที่พร้อมแผนที่แยก</p>
</header>
<main>
<section class="panel" aria-label="เลือกพื้นที่">
<label class="lbl" for="title">ชื่อหัวข้อแผนที่</label>
<input id="title" class="ttl" type="text" maxlength="80" value="แผนที่ประเทศไทย" placeholder="พิมพ์ชื่อหัวข้อ (เว้นว่างได้)">
<h2>จังหวัด / ภาคที่ต้องการแสดง</h2>
<div id="rows"></div>
<label class="opt"><input type="checkbox" id="others"> แสดงชื่อจังหวัดอื่นบนแผนที่</label>
<div class="opt" role="radiogroup" aria-label="ภาษาชื่อจังหวัด">ภาษาชื่อ / Language:
<label class="opt" style="margin:0"><input type="radio" name="lang" value="th" checked> ไทย</label>
<label class="opt" style="margin:0"><input type="radio" name="lang" value="en"> English</label></div>
<div class="actions">
<button id="add" type="button">+ เพิ่มจังหวัด / ภาค</button>
<button id="go" class="primary" type="button">ประมวลผล</button>
<button id="png" type="button" disabled>ดาวน์โหลด PNG</button>
<button id="reset" type="button">รีเซ็ตข้อมูล</button>
</div>
<p id="msg" role="status"></p>
</section>
<section id="stage" aria-live="polite"><div class="empty">ยังไม่มีแผนที่ — เลือกจังหวัดหรือภาค แล้วกด “ประมวลผล”</div></section>
</main>

function addRow(){

function items(){
  const seen=new Set(), out=[];

    const v=r.querySelector('select').value; if(!v||seen.has(v))continue; seen.add(v);

    if(t==='P') out.push({name:nm(k),ids:[k],color});

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  ids.forEach(i=>{const q=D[i].b;a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[2]);d=Math.max(d,q[3]);});

function anchor(it){
  if(it.ids.length===1)return D[it.ids[0]].c;

  if($('#others').checked){
    IDS.forEach(i=>{ if(sel[i])return; const c=D[i].c;
      labels+=`<text x="${(mapX-MX0+c[0]).toFixed(1)}" y="${(mapY-MY0+c[1]+3).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#5d6b65" stroke="#e6eae7" stroke-width="2.5" paint-order="stroke" stroke-linejoin="round">${esc(nm(i))}</text>`; });
  }
  s+=lines+cards+labels+`</svg>`;
  return s;
}
let lastSVG='';
function render(){
  const its=items();
  if(!its.length){msg.textContent='กรุณาเลือกจังหวัดหรือภาคอย่างน้อย 1 รายการ';return;}
  lastSVG=build(its);
  $('#stage').innerHTML=lastSVG; $('#png').disabled=false;
  const n=new Set(its.flatMap(i=>i.ids)).size;
  msg.textContent=`แสดง ${its.length} รายการ (${n} จังหวัด)`;
}
function toPNG(){
  return new Promise((res,rej)=>{
    const img=new Image(), url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(lastSVG);
    img.onload=()=>{
      const sc=Math.min(2,8000/Math.max(img.naturalWidth||1,img.naturalHeight||1)), c=document.createElement('canvas'), w=img.naturalWidth, h=img.naturalHeight;
      c.width=w*sc;c.height=h*sc; const x=c.getContext('2d'); x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      x.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('toBlob')),'image/png');
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
function showFallback(blob){
  let f=document.getElementById('fb'); if(!f){f=document.createElement('div');f.id='fb';f.style.marginTop='10px';msg.after(f);}
  const u=URL.createObjectURL(blob);
  f.innerHTML=`<a href="${u}" download="thailand-map.png" target="_blank" rel="noopener" style="color:var(--acc)">กดที่นี่เพื่อบันทึกภาพ PNG</a><img src="${u}" alt="ตัวอย่างแผนที่" style="display:block;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:6px"><small style="color:var(--mut)">ถ้าไฟล์ไม่ลงเครื่อง ให้กดค้างที่ภาพแล้วเลือกบันทึกภาพ</small>`;
}
$('#png').onclick=async()=>{
  if(!lastSVG)return;
  try{
    const blob=await toPNG(); let dl=null; try{ dl=(typeof claude!=='undefined'&&claude&&claude.use)?await claude.use('downloads'):null; }catch(_){ dl=null; }
    if(dl){ await dl.save({filename:'thailand-map.png',data:blob}); msg.textContent='บันทึกไฟล์ PNG แล้ว'; }
    else{ const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='thailand-map.png';document.body.appendChild(a);a.click();a.remove(); showFallback(blob); msg.textContent='ถ้าไม่มีไฟล์ถูกบันทึก ให้เปิดหน้านี้จากลิงก์เต็มในหน้าต่างใหม่แล้วลองอีกครั้ง'; }
  }catch(e){ msg.textContent=(e&&e.code==='declined')?'ยกเลิกการดาวน์โหลด':'ดาวน์โหลดไม่สำเร็จ ('+((e&&(e.code||e.message))||'unknown')+') ลองอีกครั้ง'; }
};
$('#add').onclick=addRow; $('#go').onclick=render;
$('#others').onchange=()=>{ if(lastSVG) render(); };
$('#title').oninput=()=>{ if(lastSVG) render(); };
document.querySelectorAll('input[name=lang]').forEach(r=>r.onchange=()=>{
  LANG=r.value;
  for(const row of rowsEl.children){ const s=row.querySelector('select'), v=s.value; s.innerHTML=optionsHTML(); s.value=v; }
  if(lastSVG) render();
});
$('#reset').onclick=()=>{rowsEl.innerHTML='';colorIdx=0;addRow();lastSVG='';$('#png').disabled=true;
  $('#stage').innerHTML='<div class="empty">ยังไม่มีแผนที่ — เลือกจังหวัดหรือภาค แล้วกด “ประมวลผล”</div>';msg.textContent='รีเซ็ตข้อมูลแล้ว';};
addRow();
</script>
</body>
